<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#09100d">
  <meta name="description" content="" data-i18n-content="app.description">
  <title data-i18n="app.title"></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="./" aria-label="" data-i18n-aria-label="nav.wildShockHome">
      <span class="brand-mark" id="brand-mark-icon" aria-hidden="true">ϟ</span>
      <span class="brand-text">
        <span data-i18n="app.brand"></span>
        <small data-i18n="nav.aSpellcraftRoguelike"></small>
      </span>
    </a>

    <nav class="main-nav" aria-label="" data-i18n-aria-label="nav.mainNavigation">
      <button class="nav active" id="realm-tab" data-tooltip="" data-i18n-tooltip="nav.returnToTheRealmT">
        <span data-i18n="nav.theRealm"></span>
      </button>
      <button class="nav" id="grimoire-tab" data-tooltip="" data-i18n-tooltip="nav.grimoireTooltip">
        <span data-i18n="nav.grimoire"></span>
        <span class="nav-badge" id="spell-total"></span>
      </button>
      <button class="nav" id="forge-tab" data-tooltip="" data-i18n-tooltip="nav.forgeTooltip">
        <span data-i18n="nav.forge"></span>
        <span class="nav-badge" id="equipment-total"></span>
      </button>
      <button class="nav" id="wiki-tab" data-tooltip="" data-i18n-tooltip="nav.wikiTooltip">
        <span data-i18n="nav.wiki"></span>
        <span class="nav-badge" id="wiki-total"></span>
      </button>
      <button class="nav" id="guide-button" data-tooltip="" data-i18n-tooltip="nav.rulesObjectivesAndControls">
        <span data-i18n="nav.fieldGuide"></span>
      </button>
    </nav>

    <div class="topbar-actions">
      <div class="save-label" data-tooltip="" data-i18n-tooltip="nav.progressIsKeptInThisBrowser">
        <i></i><span id="save-state"></span>
      </div>
      <div class="language-picker">
        <label class="sr-only" for="language-select" data-i18n="common.language"></label>
        <select id="language-select" aria-label="" data-i18n-aria-label="common.language"></select>
      </div>
      <button class="small-button primary-outline" id="new-button" data-tooltip="" data-i18n-tooltip="nav.replaceTheCurrentSavedJourney">
        <span data-i18n="nav.newJourney"></span> <span aria-hidden="true">↗</span>
      </button>
    </div>
  </div>
</header>

<main>
  <section class="page-heading">
    <div class="heading-copy">
      <div class="eyebrow">
        <span data-i18n="heading.theFracturedExpanse"></span>
        <span class="sep">/</span>
        <span data-i18n="heading.journey"></span>
        <span id="seed-label" class="seed-pill"></span>
        <span id="mode-badge" class="mode-badge"></span>
      </div>
      <h1 id="page-title"></h1>
      <p id="page-subtitle"></p>
    </div>
    <div class="realm-counter" data-tooltip="" data-i18n-tooltip="heading.clearARealmToOpenItsRifts">
      <span id="realm-number">01</span>
      <div>
        <span data-i18n="heading.realm"></span>
        <small id="realm-total" data-i18n="heading.of100"></small>
      </div>
    </div>
  </section>

  <!-- ==================== VIEW 1: THE REALM ==================== -->
  <section id="realm-view" class="game-layout">
    <aside class="left-panel panel">
      <div class="panel-heading">
        <span data-i18n="player.theWayfarer"></span>
        <span class="heading-sigil">✧</span>
      </div>

      <div class="portrait">
        <div id="wizard-portrait" class="portrait-frame"></div>
        <div class="portrait-meta">
          <h2 data-i18n="player.theRiftwalker"></h2>
          <span id="build-label" class="build-pill"></span>
        </div>
      </div>

      <div class="resource" data-tooltip="" data-i18n-tooltip="player.whenVitalityReachesZeroTheJourneyEnds">
        <label>
          <span class="res-label-with-icon"><span id="icon-vitality" aria-hidden="true"></span><span data-i18n="player.vitality"></span></span>
          <strong id="health-label"></strong>
        </label>
        <div class="bar segmented-bar"><div id="health-bar"></div></div>
      </div>

      <div class="stats-row stats-grid-3">
        <span class="stat-tile" data-tooltip="" data-i18n-tooltip="player.shieldsTooltip">
          <span class="stat-head"><span id="icon-shields" aria-hidden="true"></span><span data-i18n="player.shields"></span></span>
          <b id="shields-label" class="cyan-val">0</b>
        </span>
        <span class="stat-tile" data-tooltip="" data-i18n-tooltip="player.wardAbsorbsDamageBeforeVitality">
          <span class="stat-head"><span id="icon-ward" aria-hidden="true"></span><span data-i18n="player.ward"></span></span>
          <b id="shield-label">0</b>
        </span>
        <span class="stat-tile" data-tooltip="" data-i18n-tooltip="player.useTheseToLearnSkillsInTheAtlas">
          <span class="stat-head"><span id="icon-sp" aria-hidden="true"></span><span data-i18n="player.skillPoints"></span></span>
          <b id="points-label" class="gold-val">12</b>
        </span>
      </div>

      <div id="status-banners" class="status-banners"></div>

      <div class="quick-nav-row">
        <button class="atlas-cta" id="grimoire-cta" data-tooltip="" data-i18n-tooltip="nav.grimoireTooltip">
          <span data-i18n="nav.grimoire"></span>
          <span>↗</span>
        </button>
      </div>

      <div class="panel-heading spell-heading">
        <span data-i18n="player.yourGrimoire"></span>
        <span id="spell-count" class="count-pill"></span>
      </div>
      <div id="spell-list"></div>

      <div class="panel-heading compact-heading">
        <span data-i18n="player.equippedGear"></span>
        <span id="allies-badge" class="ally-pill"></span>
      </div>
      <div id="equipped-summary" class="equipped-summary"></div>

      <div class="supplies">
        <button id="potion-button" data-tooltip="" data-i18n-tooltip="player.potionTooltip">
          <span class="action-icon potion-icon" id="icon-potion" aria-hidden="true">⚗</span>
          <div class="supply-copy">
            <span data-i18n="player.restorationDraught"></span>
            <small data-i18n="player.restoreHealthChargesP"></small>
          </div>
          <b id="potions-label">3</b>
        </button>
      </div>
    </aside>

    <div class="arena-column">
      <div class="arena-bar">
        <span class="arena-biome"><i></i> <b id="realm-name"></b></span>
        <span id="turn-label" class="turn-pill"></span>
      </div>
      <div class="canvas-wrap">
        <canvas id="board" width="736" height="736" tabindex="0" aria-label="" data-i18n-aria-label="realm.accessibleDescription"></canvas>
        <div class="board-key" aria-hidden="true">
          <span data-i18n="realm.move"></span><b>WASD</b>
          <span class="key-sep">·</span>
          <span data-i18n="realm.cast"></span><b>1–9</b>
        </div>
        <div id="outcome" hidden></div>
      </div>
      <div class="arena-footer">
        <span id="target-hint"></span>
        <div class="arena-controls">
          <button id="threat-button" aria-pressed="false" data-tooltip="" data-i18n-tooltip="realm.threatTooltip">
            <span class="action-icon" id="icon-threat" aria-hidden="true">◉</span>
            <span data-i18n="realm.showAttackZones"></span>
            <kbd>Y</kbd>
          </button>
          <button id="wait-button" data-tooltip="" data-i18n-tooltip="realm.endYourTurnWithoutMovingSpace">
            <span class="action-icon" id="icon-wait" aria-hidden="true">◷</span>
            <span data-i18n="realm.wait"></span>
            <kbd data-i18n="realm.space"></kbd>
          </button>
        </div>
      </div>
      <div class="touch-controls" aria-label="" data-i18n-aria-label="realm.movementControls">
        <button data-move="0,-1" aria-label="" data-tooltip="" data-i18n-aria-label="realm.moveUp" data-i18n-tooltip="realm.moveUp">↑</button>
        <button data-move="-1,0" aria-label="" data-tooltip="" data-i18n-aria-label="realm.moveLeft" data-i18n-tooltip="realm.moveLeft">←</button>
        <button data-move="0,1" aria-label="" data-tooltip="" data-i18n-aria-label="realm.moveDown" data-i18n-tooltip="realm.moveDown">↓</button>
        <button data-move="1,0" aria-label="" data-tooltip="" data-i18n-aria-label="realm.moveRight" data-i18n-tooltip="realm.moveRight">→</button>
      </div>
    </div>

    <aside class="right-panel">
      <div class="panel objective">
        <div class="eyebrow" data-i18n="objective.yourObjective"></div>
        <h2 data-i18n="objective.silenceTheRealm"></h2>
        <p><span data-i18n="objective.defeatItsInhabitants"></span><br><span data-i18n="objective.chooseARiftGoDeeper"></span></p>
        <div class="enemy-count" data-tooltip="" data-i18n-tooltip="objective.theRiftsOpenAfterEveryHostileIsDefeated">
          <span id="enemy-count">8</span>
          <div>
            <span data-i18n="objective.hostiles"></span>
            <small data-i18n="objective.remaining"></small>
          </div>
          <span class="enemy-icon" id="icon-skull" aria-hidden="true">☠</span>
        </div>
        <div class="rift-status" id="rift-status"></div>
        <button id="reroll-rifts" class="atlas-cta"></button>
      </div>

      <div class="panel inspect-panel">
        <div class="panel-heading">
          <span data-i18n="inspection.inspect"></span>
          <span class="heading-sigil">⌖</span>
        </div>
        <div id="inspection"></div>
        <button id="bestiary-button" class="atlas-cta" data-i18n="bestiary.title"></button>
      </div>

      <div class="panel forge-panel">
        <div class="panel-heading">
          <span data-i18n="nav.forge"></span>
          <span id="forge-catalogue" class="count-pill"></span>
        </div>
        <p id="forge-inventory" class="muted"></p>
        <p id="forge-equipment" class="muted"></p>
        <button class="atlas-cta" id="open-forge-cta">
          <span data-i18n="nav.forge"></span> <span>↗</span>
        </button>
        <div class="shrine-block">
          <div class="shrine-header">
            <span id="shrine-icon-slot" aria-hidden="true"></span>
            <div>
              <h3 id="shrine-title" data-i18n="shrine.transmutation"></h3>
              <p id="shrine-state" class="muted"></p>
            </div>
          </div>
          <div id="shrine-special-box">
            <p id="shrine-special-desc" class="muted"></p>
            <select id="shrine-special-select" data-i18n-aria-label="shrine.selectSource" hidden></select>
            <select id="shrine-result" data-i18n-aria-label="shrine.selectResult" hidden></select>
            <button id="shrine-activate-button" data-i18n="shrine.useButton"></button>
          </div>
        </div>
      </div>

      <div class="panel journal">
        <div class="panel-heading">
          <span data-i18n="chronicle.theChronicle"></span>
          <span class="heading-sigil">≡</span>
        </div>
        <div id="log" aria-live="polite"></div>
        <div class="journal-controls"><button id="older-turn" data-i18n="journal.older"></button><button id="newer-turn" data-i18n="journal.newer"></button></div>
      </div>
    </aside>
  </section>

  <!-- ==================== VIEW 2: GRIMOIRE ==================== -->
  <section id="grimoire-view" hidden>
    <div class="atlas-toolbar panel">
      <div>
        <span class="eyebrow" data-i18n="nav.grimoire"></span>
        <h2 data-i18n="compendium.grimoireTitle"></h2>
        <p class="muted" data-i18n="compendium.grimoireSubtitle"></p>
      </div>
      <div class="atlas-summary">
        <b id="grimoire-learned-count">0</b>
        <span id="grimoire-points"></span>
      </div>
    </div>
    <div class="atlas-controls">
      <input type="search" id="spell-search" placeholder="" data-i18n-placeholder="compendium.searchSpells">
      <select id="tag-filter"></select>
      <select id="level-filter"></select>
      <select id="status-filter">
        <option value="all" data-i18n="atlas.allSkills"></option>
        <option value="learned" data-i18n="compendium.learnedOnly"></option>
        <option value="available" data-i18n="compendium.availableOnly"></option>
      </select>
    </div>
    <div id="spell-grid" class="catalog-grid"></div>
  </section>

  <!-- ==================== VIEW 3: ARCANE FORGE ==================== -->
  <section id="forge-view" hidden>
    <div class="atlas-toolbar panel">
      <div>
        <span class="eyebrow" data-i18n="nav.forge"></span>
        <h2 data-i18n="compendium.forgeTitle"></h2>
        <p class="muted" data-i18n="compendium.forgeSubtitle"></p>
      </div>
      <div class="atlas-summary">
        <b id="forge-craftable-count">0</b>
        <span data-i18n="compendium.craftableOnly"></span>
      </div>
    </div>

    <div class="forge-overview-grid">
      <div class="panel satchel-panel">
        <div class="panel-heading">
          <span id="satchel-title"></span>
          <span class="heading-sigil">✦</span>
        </div>
        <div id="satchel-chips" class="chip-wrap"></div>
      </div>
      <div class="panel loadout-panel">
        <div class="panel-heading">
          <span data-i18n="player.equippedGear"></span>
          <span class="heading-sigil">◈</span>
        </div>
        <div id="forge-equipped-strip" class="forge-equipped-strip"></div>
      </div>
    </div>

    <div class="atlas-controls">
      <input type="search" id="eq-search" placeholder="" data-i18n-placeholder="compendium.searchEquipment">
      <select id="slot-filter"></select>
      <select id="eq-status-filter">
        <option value="all" data-i18n="atlas.allSkills"></option>
        <option value="craftable" data-i18n="compendium.craftableOnly"></option>
      </select>
    </div>
    <div id="eq-grid" class="catalog-grid"></div>
  </section>

  <!-- ==================== VIEW 4: ARCANE ENCYCLOPEDIA (WIKI) ==================== -->
  <section id="wiki-view" hidden></section>

  <footer>
    <span><span data-i18n="app.brand"></span> <span class="footer-dot">✦</span> <span data-i18n="footer.everyTurnIsAChoice"></span></span>
    <span><span data-i18n="nav.grimoire"></span> (198) <span class="footer-dot">·</span> <span data-i18n="nav.forge"></span> (375)</span>
  </footer>
</main>

<dialog id="detail-dialog">
  <button class="close-dialog" aria-label="" data-i18n-aria-label="common.close">×</button>
  <div id="detail-content"></div>
</dialog>

<dialog id="ingredients-dialog">
  <button class="close-dialog" data-i18n-aria-label="common.close">×</button>
  <h2 id="ingredient-title"></h2><p id="ingredient-recipe"></p>
  <div id="ingredient-choices"></div>
  <button id="craft-chosen" class="primary" data-i18n="compendium.forgeItem"></button>
</dialog>
<dialog id="bestiary-dialog">
  <button class="close-dialog" data-i18n-aria-label="common.close">×</button>
  <h2 data-i18n="bestiary.title"></h2>
  <input type="search" id="unit-search" data-i18n-placeholder="bestiary.search" data-i18n-aria-label="bestiary.search">
  <label><input type="checkbox" id="unit-discovered"> <span data-i18n="bestiary.discovered"></span></label>
  <select id="unit-select" size="7" data-i18n-aria-label="bestiary.title"></select>
  <div id="unit-detail"></div>
</dialog>
<dialog id="guide-dialog">
  <button class="close-dialog" aria-label="" data-i18n-aria-label="guide.close">×</button>
  <div class="eyebrow" data-i18n="guide.fieldGuide"></div>
  <h2><span data-i18n="guide.aLittleKnowledge"></span><br><span data-i18n="guide.aLongerLife"></span></h2>
  <p data-i18n="guide.introduction"></p>
  <p data-i18n="guide.reselect"></p>
  <label><span data-i18n="wardrobe.title"></span> <select id="wardrobe-select"></select></label>
  <p id="outfit-info" class="muted"></p>
  <dl>
    <dt data-i18n="guide.moveStrike"></dt><dd data-i18n="guide.move.description"></dd>
    <dt data-i18n="guide.castASpell"></dt><dd data-i18n="guide.cast.description"></dd>
    <dt data-i18n="guide.recover"></dt><dd data-i18n="guide.recover.description"></dd>
    <dt data-i18n="guide.learn"></dt><dd data-i18n="guide.learn.description"></dd>
    <dt data-i18n="guide.chooseARift"></dt><dd data-i18n="guide.rift.description"></dd>
    <dt data-i18n="guide.craftArtifacts"></dt><dd data-i18n="guide.craft.description"></dd>
    <dt data-i18n="guide.transmute"></dt><dd data-i18n="guide.transmute.description"></dd>
    <dt data-i18n="guide.scout"></dt><dd data-i18n="guide.scout.description"></dd>
    <dt data-i18n="guide.survive"></dt><dd data-i18n="guide.survive.description"></dd>
  </dl>
  <p class="muted" data-i18n="guide.storage"></p>
</dialog>

<dialog id="reward-dialog"><h2 data-i18n="reward.choose"></h2><div id="reward-options"></div></dialog>
<dialog id="new-dialog">
  <div class="eyebrow" data-i18n="journey.aNewBeginning"></div>
  <h2 data-i18n="journey.stepIntoAnotherRift"></h2>
  <p data-i18n="journey.confirmDescription"></p>
  <label class="seed-input">
    <span data-i18n="journey.modeLabel"></span>
    <select id="new-mode">
      <option value="standard" data-i18n="mode.standard"></option>
      <option value="classic" data-i18n="mode.classic"></option>
      <option value="trial-pyromancer" data-i18n="mode.trial-pyromancer"></option>
      <option value="trial-necromancer" data-i18n="mode.trial-necromancer"></option>
      <option value="trial-stormcaller" data-i18n="mode.trial-stormcaller"></option>
      <option value="trial-conjurer" data-i18n="mode.trial-conjurer"></option>
      <option value="trial-ironman" data-i18n="mode.trial-ironman"></option>
      <option value="trial-electromancer" data-i18n="mode.trial-electromancer"></option>
      <option value="trial-cryomancer" data-i18n="mode.trial-cryomancer"></option>
      <option value="trial-phytomancer" data-i18n="mode.trial-phytomancer"></option>
      <option value="trial-manamancer" data-i18n="mode.trial-manamancer"></option>
      <option value="trial-sanctumancer" data-i18n="mode.trial-sanctumancer"></option>
      <option value="trial-ferromancer" data-i18n="mode.trial-ferromancer"></option>
      <option value="trial-hemomancer" data-i18n="mode.trial-hemomancer"></option>
      <option value="trial-chronomancer" data-i18n="mode.trial-chronomancer"></option>
      <option value="trial-improviser" data-i18n="mode.trial-improviser"></option>
      <option value="trial-scavenger" data-i18n="mode.trial-scavenger"></option>
      <option value="mutated" data-i18n="mode.mutated"></option>
      <option value="weekly" data-i18n="mode.weekly"></option>
      <option value="custom" data-i18n="mode.custom"></option>
    </select>
  </label>
  <label class="seed-input">
    <span data-i18n="journey.worldSeedOptional"></span>
    <input id="new-seed" type="number" min="0" max="2147483647" placeholder="" data-i18n-placeholder="journey.randomWorld">
  </label>
  <fieldset id="mutator-options" hidden><legend data-i18n="mutators.title"></legend>
<label><input type="checkbox" value="enemyResistance"><span data-i18n="mutators.enemyResistance"></span></label>
<label><input type="checkbox" value="vulnerability"><span data-i18n="mutators.vulnerability"></span></label>
<label><input type="checkbox" value="weather"><span data-i18n="mutators.weather"></span></label>
<label><input type="checkbox" value="damageDebuff"><span data-i18n="mutators.damageDebuff"></span></label>
</fieldset>
  <div class="dialog-actions">
    <button id="cancel-new" data-i18n="journey.keepExploring"></button>
    <button class="primary" id="confirm-new" data-i18n="journey.beginJourney"></button>
  </div>
</dialog>

<script type="module" src="./src/app.js"></script>
</body>
</html>
